upstream ttube_apps {
    least_conn;
    server ttube-a:8080 max_fails=3 fail_timeout=10s;
    server ttube-b:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=ttube_api:10m rate=25r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    location / {
        limit_req zone=ttube_api burst=80 nodelay;
        proxy_pass http://ttube_apps;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }
}
