name: ttube

x-ttube-environment: &ttube-environment
  ASPNETCORE_URLS: http://+:8080
  ConnectionStrings__Redis: redis:6379
  YouTube__ApiKey: ${YOUTUBE_API_KEY:-}
  YouTube__OAuthClientId: ${YOUTUBE_OAUTH_CLIENT_ID:-}
  YouTube__OAuthClientSecret: ${YOUTUBE_OAUTH_CLIENT_SECRET:-}
  Ttube__BaseUrl: ${TTUBE_BASE_URL:-http://localhost:8080}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ttube-a:
    build: .
    environment: *ttube-environment
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ttube-b:
    build: .
    environment: *ttube-environment
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ttube-a
      - ttube-b
    restart: unless-stopped
